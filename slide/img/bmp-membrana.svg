<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Sezione di un sensore di pressione: membrana di silicio sopra una cavità sotto vuoto</title>
  <defs>
    <marker id="giu" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/>
    </marker>
    <marker id="avanti" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1d3a"/>
    </marker>
  </defs>

  <!-- aria che preme -->
  <text x="350" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1d6fd8">pressione dell'aria</text>
  <g stroke="#1d6fd8" stroke-width="5" marker-end="url(#giu)">
    <line x1="240" y1="62" x2="240" y2="146"/><line x1="295" y1="62" x2="295" y2="156"/>
    <line x1="350" y1="62" x2="350" y2="160"/><line x1="405" y1="62" x2="405" y2="156"/>
    <line x1="460" y1="62" x2="460" y2="146"/>
  </g>

  <!-- silicio, cavità, membrana -->
  <rect x="80" y="190" width="540" height="140" fill="#a7b1c0"/>
  <path d="M200,190 Q350,226 500,190 V300 H200 Z" fill="#0b1d3a"/>
  <text x="350" y="275" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">vuoto</text>
  <path d="M80,170 H200 Q350,206 500,170 H620 V190 H500 Q350,226 200,190 H80 Z" fill="#dfe5ec" stroke="#5b6475" stroke-width="1.5"/>
  <g fill="#ff7a1a">
    <rect x="206" y="165" width="18" height="8"/><rect x="476" y="165" width="18" height="8"/>
    <rect x="311" y="179" width="18" height="8"/><rect x="371" y="179" width="18" height="8"/>
  </g>
  <text x="350" y="360" text-anchor="middle" font-size="18" fill="#5b6475">il chip intero misura 3,6 × 3,8 mm</text>

  <!-- etichette -->
  <g stroke="#5b6475" stroke-width="1.5">
    <line x1="590" y1="178" x2="665" y2="150"/>
    <line x1="494" y1="166" x2="665" y2="232"/>
    <line x1="470" y1="270" x2="665" y2="312"/>
  </g>
  <g font-size="22" fill="#1f2937">
    <text x="675" y="146"><tspan font-weight="700">membrana di silicio</tspan></text>
    <text x="675" y="174" fill="#5b6475">più sottile di un capello: si flette</text>
    <text x="675" y="228"><tspan font-weight="700" fill="#e8630a">resistenze «piezo»</tspan></text>
    <text x="675" y="256" fill="#5b6475">se piegate, cambiano valore</text>
    <text x="675" y="310"><tspan font-weight="700">cavità sotto vuoto</tspan></text>
    <text x="675" y="338" fill="#5b6475">il riferimento: lo «zero» di pressione</text>
  </g>

  <!-- catena di misura -->
  <g font-size="19" fill="#0b1d3a" text-anchor="middle">
    <rect x="20" y="390" width="180" height="66" rx="33" fill="#e3f0ff" stroke="#1d6fd8" stroke-width="2"/>
    <text x="110" y="418">la membrana</text><text x="110" y="442">si piega</text>
    <rect x="240" y="390" width="180" height="66" rx="33" fill="#fff1e6" stroke="#ff7a1a" stroke-width="2"/>
    <text x="330" y="418">le resistenze</text><text x="330" y="442">cambiano</text>
    <rect x="460" y="390" width="180" height="66" rx="33" fill="#eef1f5" stroke="#7d8aa0" stroke-width="2"/>
    <text x="550" y="418">una tensione</text><text x="550" y="442">minuscola</text>
    <rect x="680" y="390" width="180" height="66" rx="33" fill="#eef1f5" stroke="#7d8aa0" stroke-width="2"/>
    <text x="770" y="418">convertitore:</text><text x="770" y="442">tensione → numero</text>
    <rect x="900" y="390" width="180" height="66" rx="33" fill="#e6f6ec" stroke="#2a9d50" stroke-width="2"/>
    <text x="990" y="418">formula:</text><text x="990" y="442">numero → metri</text>
  </g>
  <g stroke="#0b1d3a" stroke-width="3.5" marker-end="url(#avanti)">
    <line x1="204" y1="423" x2="232" y2="423"/><line x1="424" y1="423" x2="452" y2="423"/>
    <line x1="644" y1="423" x2="672" y2="423"/><line x1="864" y1="423" x2="892" y2="423"/>
  </g>
</svg>
