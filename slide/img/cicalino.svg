<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Sezione di un cicalino magnetico attivo</title>

  <!-- onde sonore -->
  <g fill="none" stroke="#1d6fd8" stroke-width="3.5" stroke-linecap="round">
    <path d="M222,96 Q250,76 278,96"/><path d="M208,74 Q250,46 292,74"/><path d="M194,52 Q250,16 306,52"/>
  </g>

  <!-- involucro sezionato -->
  <rect x="60" y="120" width="380" height="280" rx="20" fill="#2b2f36"/>
  <rect x="85" y="145" width="330" height="235" rx="8" fill="#f4f6f9"/>
  <rect x="230" y="118" width="40" height="30" fill="#f4f6f9"/>

  <!-- lamina (con la posizione «vibrata» tratteggiata) -->
  <path d="M100,166 Q250,150 400,166" fill="none" stroke="#9aa5b4" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="100" y="172" width="300" height="10" fill="#7d8aa0"/>

  <!-- nucleo e bobina -->
  <rect x="230" y="210" width="40" height="160" fill="#7d8aa0"/>
  <g fill="#c98a00" stroke="#8a5e00" stroke-width="1.5">
    <rect x="190" y="230" width="40" height="120"/><rect x="270" y="230" width="40" height="120"/>
  </g>
  <g stroke="#8a5e00" stroke-width="1.5">
    <line x1="190" y1="250" x2="230" y2="250"/><line x1="190" y1="270" x2="230" y2="270"/>
    <line x1="190" y1="290" x2="230" y2="290"/><line x1="190" y1="310" x2="230" y2="310"/>
    <line x1="190" y1="330" x2="230" y2="330"/>
    <line x1="270" y1="250" x2="310" y2="250"/><line x1="270" y1="270" x2="310" y2="270"/>
    <line x1="270" y1="290" x2="310" y2="290"/><line x1="270" y1="310" x2="310" y2="310"/>
    <line x1="270" y1="330" x2="310" y2="330"/>
  </g>

  <!-- magnete e oscillatore -->
  <rect x="100" y="300" width="70" height="30" fill="#d64545"/><rect x="330" y="300" width="70" height="30" fill="#d64545"/>
  <rect x="330" y="344" width="60" height="26" rx="3" fill="#1f2a37"/>

  <!-- piedini -->
  <g stroke="#9aa5b4" stroke-width="6"><line x1="170" y1="400" x2="170" y2="470"/><line x1="330" y1="400" x2="330" y2="470"/></g>
  <text x="170" y="503" text-anchor="middle" font-size="28" font-weight="800" fill="#d64545">+</text>
  <text x="330" y="503" text-anchor="middle" font-size="28" font-weight="800" fill="#0b1d3a">−</text>

  <!-- etichette -->
  <g stroke="#5b6475" stroke-width="1.5">
    <line x1="400" y1="177" x2="470" y2="150"/>
    <line x1="310" y1="262" x2="470" y2="236"/>
    <line x1="400" y1="315" x2="470" y2="318"/>
    <line x1="390" y1="357" x2="470" y2="396"/>
  </g>
  <g font-size="21" fill="#1f2937">
    <text x="480" y="146" font-weight="700">lamina di metallo</text>
    <text x="480" y="172" fill="#5b6475">vibra e fa il suono</text>
    <text x="480" y="232" font-weight="700" fill="#8a5e00">bobina</text>
    <text x="480" y="258" fill="#5b6475">con la corrente diventa</text>
    <text x="480" y="282" fill="#5b6475">una calamita</text>
    <text x="480" y="324" font-weight="700" fill="#d64545">magnete fisso</text>
    <text x="480" y="394" font-weight="700">oscillatore</text>
    <text x="480" y="420" fill="#5b6475">accende e spegne la bobina</text>
    <text x="480" y="444" fill="#5b6475">2 500 volte al secondo</text>
  </g>
</svg>
