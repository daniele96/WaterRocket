<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Dentro un microcontrollore: CPU, memorie, periferiche e pin</title>

  <!-- pin -->
  <g fill="#b8c0cc" stroke="#7d8aa0" stroke-width="1.5">
    <rect x="80" y="113" width="30" height="14"/><rect x="80" y="153" width="30" height="14"/>
    <rect x="80" y="193" width="30" height="14"/><rect x="80" y="233" width="30" height="14"/>
    <rect x="80" y="273" width="30" height="14"/><rect x="80" y="313" width="30" height="14"/>
    <rect x="80" y="353" width="30" height="14"/><rect x="80" y="393" width="30" height="14"/>
    <rect x="80" y="433" width="30" height="14"/>
    <rect x="530" y="113" width="30" height="14"/><rect x="530" y="153" width="30" height="14"/>
    <rect x="530" y="193" width="30" height="14"/><rect x="530" y="233" width="30" height="14"/>
    <rect x="530" y="273" width="30" height="14"/><rect x="530" y="313" width="30" height="14"/>
    <rect x="530" y="353" width="30" height="14"/><rect x="530" y="393" width="30" height="14"/>
    <rect x="530" y="433" width="30" height="14"/>
    <rect x="143" y="60" width="14" height="30"/><rect x="188" y="60" width="14" height="30"/>
    <rect x="233" y="60" width="14" height="30"/><rect x="278" y="60" width="14" height="30"/>
    <rect x="323" y="60" width="14" height="30"/><rect x="368" y="60" width="14" height="30"/>
    <rect x="413" y="60" width="14" height="30"/><rect x="458" y="60" width="14" height="30"/>
    <rect x="143" y="470" width="14" height="30"/><rect x="188" y="470" width="14" height="30"/>
    <rect x="233" y="470" width="14" height="30"/><rect x="278" y="470" width="14" height="30"/>
    <rect x="323" y="470" width="14" height="30"/><rect x="368" y="470" width="14" height="30"/>
    <rect x="413" y="470" width="14" height="30"/><rect x="458" y="470" width="14" height="30"/>
  </g>

  <rect x="110" y="90" width="420" height="380" rx="16" fill="#1f2a37"/>

  <rect x="135" y="115" width="180" height="115" rx="12" fill="#ff7a1a"/>
  <text x="225" y="165" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">CPU</text>
  <text x="225" y="197" text-anchor="middle" font-size="18" fill="#ffffff">esegue le istruzioni</text>

  <rect x="325" y="115" width="180" height="115" rx="12" fill="#1d6fd8"/>
  <text x="415" y="165" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">RAM</text>
  <text x="415" y="197" text-anchor="middle" font-size="18" fill="#ffffff">memoria di lavoro</text>

  <rect x="135" y="240" width="180" height="95" rx="12" fill="#2a9d50"/>
  <text x="225" y="282" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">Flash</text>
  <text x="225" y="312" text-anchor="middle" font-size="18" fill="#ffffff">il programma</text>

  <rect x="325" y="240" width="180" height="95" rx="12" fill="#7b4fd1"/>
  <text x="415" y="282" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">Radio</text>
  <text x="415" y="312" text-anchor="middle" font-size="18" fill="#ffffff">WiFi · Bluetooth</text>

  <rect x="135" y="345" width="370" height="100" rx="12" fill="#3a4a5e"/>
  <text x="320" y="387" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">Periferiche</text>
  <text x="320" y="419" text-anchor="middle" font-size="18" fill="#dbe3ee">I²C · SPI · timer · convertitori…</text>

  <text x="320" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1d3a">un computer intero in un solo chip</text>
  <text x="320" y="540" text-anchor="middle" font-size="22" fill="#1f2937">i <tspan font-weight="700">pin</tspan>: i «fili» verso il mondo esterno</text>
</svg>
