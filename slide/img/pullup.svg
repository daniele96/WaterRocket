<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pull-up e open drain: la resistenza tiene il filo alto, chi parla lo tira a massa</title>

  <!-- 3,3 V -->
  <line x1="200" y1="40" x2="400" y2="40" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round"/>
  <text x="300" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#e8630a">3,3 V</text>

  <!-- resistenza di pull-up -->
  <path d="M300,40 V80 l14,8 l-28,16 l28,16 l-28,16 l28,16 l-28,16 l14,8 V200" fill="none" stroke="#0b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <text x="330" y="132" font-size="20" fill="#1f2937">resistenza</text>
  <text x="330" y="156" font-size="20" fill="#1f2937">«di pull-up»</text>

  <!-- filo SDA -->
  <line x1="90" y1="200" x2="510" y2="200" stroke="#1d6fd8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="8" fill="#0b1d3a"/>
  <text x="510" y="186" text-anchor="end" font-size="22" font-weight="800" fill="#1d6fd8">SDA</text>

  <!-- interruttore XIAO (aperto) -->
  <g stroke="#0b1d3a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M150,200 V270"/>
    <path d="M150,270 L185,325"/>
    <path d="M150,330 V385"/>
    <path d="M120,385 H180 M130,397 H170 M140,409 H160"/>
  </g>
  <circle cx="150" cy="200" r="8" fill="#0b1d3a"/>
  <circle cx="150" cy="270" r="5" fill="#0b1d3a"/><circle cx="150" cy="330" r="5" fill="#0b1d3a"/>
  <text x="150" y="448" text-anchor="middle" font-size="22" font-weight="700" fill="#0b1d3a">XIAO</text>
  <text x="150" y="474" text-anchor="middle" font-size="18" fill="#5b6475">aperto: tace</text>

  <!-- interruttore sensore (chiuso) -->
  <g stroke="#0b1d3a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M440,200 V270"/>
    <path d="M440,270 L440,330" stroke="#2a9d50" stroke-width="5"/>
    <path d="M440,330 V385"/>
    <path d="M410,385 H470 M420,397 H460 M430,409 H450"/>
  </g>
  <circle cx="440" cy="200" r="8" fill="#0b1d3a"/>
  <circle cx="440" cy="270" r="5" fill="#0b1d3a"/><circle cx="440" cy="330" r="5" fill="#0b1d3a"/>
  <text x="440" y="448" text-anchor="middle" font-size="22" font-weight="700" fill="#0b1d3a">sensore</text>
  <text x="440" y="474" text-anchor="middle" font-size="18" fill="#2a9d50">chiuso: dice «0»</text>

  <text x="192" y="403" font-size="18" fill="#5b6475">GND (0 V)</text>
  <text x="482" y="403" font-size="18" fill="#5b6475">GND (0 V)</text>
</svg>
