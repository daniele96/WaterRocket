; Firmware «istruzione» — Water Rocket
;
; Piccole demo dei sensori del razzo, una alla volta, sul monitor seriale.
; Stessa scheda e stessa piattaforma del firmware di volo (../firmware): si
; flasha sulla stessa XIAO, e per tornare al volo si riflasha quello.

[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1        ; solo gli errori: la seriale resta pulita per le demo

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.5

monitor_speed = 115200
upload_speed = 921600
