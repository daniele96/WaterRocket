; Firmware Water Rocket — Seeed Studio XIAO ESP32S3 Sense
;
; Usa la piattaforma "pioarduino" (fork community di platform-espressif32):
; la piattaforma ufficiale PlatformIO è ferma all'Arduino core 2.x, mentre
; pioarduino segue l'Arduino-ESP32 core 3.x / ESP-IDF 5.x.
; Per aggiornare: https://github.com/pioarduino/platform-espressif32/releases

[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; La board definition abilita già PSRAM (OPI 8MB), USB CDC on boot e flash 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3        ; 0=none ... 5=verbose (log_i/log_w/log_e)

; Web server asincrono: più connessioni in parallelo (pagina, miniature, download).
; NeoPixel: anello WS2812B su D3 (via RMT)
lib_deps =
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.12.1
    adafruit/Adafruit NeoPixel @ ^1.12.5

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

upload_speed = 921600
