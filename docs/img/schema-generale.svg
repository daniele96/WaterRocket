<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Schema generale: XIAO, LiPo, BMP280, MPU6050, cicalino e anello LED</title>
  <rect x="1" y="1" width="958" height="558" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Elettronica di volo — schema generale</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#57606a">tutto quello che va cablato a mano · camera, microfono e microSD sono già sulla shield Sense</text>

  <!-- XIAO al centro -->
  <rect x="390" y="150" width="180" height="250" rx="14" fill="#1f2a37" stroke="#0d1117" stroke-width="2"/>
  <rect x="430" y="128" width="100" height="30" rx="8" fill="#a8b1bb" stroke="#6e7781"/>
  <text x="480" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">USB-C</text>
  <text x="480" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">XIAO</text>
  <text x="480" y="290" text-anchor="middle" font-size="12" fill="#c9d1d9">ESP32-S3 Sense</text>
  <text x="480" y="224" text-anchor="middle" font-size="11" fill="#8b949e">camera · mic · microSD</text>
  <!-- pin usati -->
  <g fill="#d4a017" stroke="#8a6a0a" stroke-width="1.5">
    <circle cx="390" cy="200" r="7"/><circle cx="390" cy="240" r="7"/><circle cx="390" cy="320" r="7"/><circle cx="390" cy="360" r="7"/>
    <circle cx="570" cy="200" r="7"/><circle cx="570" cy="240" r="7"/><circle cx="570" cy="300" r="7"/>
  </g>
  <g font-size="11.5" fill="#ffffff" font-weight="600">
    <text x="402" y="204">3V3</text><text x="402" y="244">GND</text><text x="402" y="324">D4 SDA</text><text x="402" y="364">D5 SCL</text>
    <text x="558" y="204" text-anchor="end">BAT+</text><text x="558" y="244" text-anchor="end">GND</text><text x="558" y="304" text-anchor="end">D3</text>
  </g>
  <circle cx="480" cy="400" r="7" fill="#d4a017" stroke="#8a6a0a" stroke-width="1.5"/>
  <text x="480" y="390" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">D1</text>

  <!-- LiPo in alto a destra -->
  <rect x="690" y="80" width="230" height="70" rx="10" fill="#c0c8d0" stroke="#6e7781" stroke-width="2"/>
  <text x="805" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">LiPo 1S 400 mAh</text>
  <text x="805" y="130" text-anchor="middle" font-size="12" fill="#24292f">JST 1.25 → pad BAT+/BAT−</text>
  <path d="M570 200 L 640 200 L 640 115 L 690 115" fill="none" stroke="#d62828" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M570 240 L 660 240 L 660 135 L 690 135" fill="none" stroke="#24292f" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- anello LED a destra -->
  <circle cx="805" cy="330" r="70" fill="#1f2a37"/>
  <circle cx="805" cy="330" r="40" fill="#ffffff"/>
  <g stroke="#57606a" stroke-width="1"><rect x="795" y="266" width="20" height="20" rx="3" fill="#ff5a5a"/><rect x="835" y="282" width="20" height="20" rx="3" fill="#ffb347"/><rect x="851" y="320" width="20" height="20" rx="3" fill="#ffe156"/><rect x="835" y="358" width="20" height="20" rx="3" fill="#6ee07a"/><rect x="795" y="374" width="20" height="20" rx="3" fill="#5ad1ff"/><rect x="755" y="358" width="20" height="20" rx="3" fill="#5a8bff"/><rect x="739" y="320" width="20" height="20" rx="3" fill="#b07aff"/><rect x="755" y="282" width="20" height="20" rx="3" fill="#ffffff"/></g>
  <text x="805" y="327" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2328">WS2812B</text>
  <text x="805" y="342" text-anchor="middle" font-size="10.5" fill="#57606a">8 LED</text>
  <path d="M640 200 L 640 250 L 700 250 L 700 300 L 735 300" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="640" cy="200" r="5" fill="#1f2328"/>
  <path d="M660 240 L 680 240 L 680 330 L 735 330" fill="none" stroke="#24292f" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="660" cy="240" r="5" fill="#1f2328"/>
  <path d="M570 300 L 610 300 L 610 360 L 735 360" fill="none" stroke="#2a9d3f" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="622" y="350" width="44" height="20" rx="3" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="644" y="364" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2328">330 Ω</text>
  <text x="712" y="295" font-size="10.5" fill="#d62828" font-weight="600">VDD</text>
  <text x="712" y="325" font-size="10.5" fill="#24292f" font-weight="600">GND</text>
  <text x="712" y="355" font-size="10.5" fill="#2a9d3f" font-weight="600">DIN</text>

  <!-- sensori a sinistra -->
  <rect x="40" y="150" width="200" height="74" rx="8" fill="#6f42c1" stroke="#4c2889" stroke-width="2"/>
  <text x="140" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">BMP280</text>
  <text x="140" y="202" text-anchor="middle" font-size="11.5" fill="#e2d6f7">altimetro · 0x76</text>
  <rect x="40" y="290" width="200" height="74" rx="8" fill="#1d4e89" stroke="#0f2f57" stroke-width="2"/>
  <text x="140" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MPU6050 GY-521</text>
  <text x="140" y="342" text-anchor="middle" font-size="11.5" fill="#c8dcf5">accel + giro · 0x68</text>
  <!-- 3V3 e GND ai due sensori -->
  <path d="M390 200 L 300 200 L 300 165 L 240 165 M300 200 L 300 305 L 240 305" fill="none" stroke="#f77f00" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M390 240 L 320 240 L 320 180 L 240 180 M320 240 L 320 320 L 240 320" fill="none" stroke="#24292f" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M390 320 L 340 320 L 340 195 L 240 195 M340 320 L 340 335 L 240 335" fill="none" stroke="#1d6fd8" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M390 360 L 360 360 L 360 210 L 240 210 M360 360 L 360 350 L 240 350" fill="none" stroke="#e0b000" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#1f2328"><circle cx="300" cy="200" r="4.5"/><circle cx="320" cy="240" r="4.5"/><circle cx="340" cy="320" r="4.5"/><circle cx="360" cy="360" r="4.5"/></g>

  <!-- cicalino in basso -->
  <circle cx="480" cy="485" r="38" fill="#24292f"/>
  <circle cx="480" cy="485" r="8" fill="#57606a"/>
  <text x="430" y="480" text-anchor="end" font-size="13" font-weight="700" fill="#1f2328">Cicalino 12095</text>
  <text x="430" y="498" text-anchor="end" font-size="11.5" fill="#57606a">+ su D1, − su GND</text>
  <path d="M480 407 L 480 447" stroke="#24292f" stroke-width="6"/>
  <path d="M480 407 L 480 447" stroke="#ffffff" stroke-width="3"/>
  <path d="M600 240 L 600 485 L 518 485" fill="none" stroke="#24292f" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="600" cy="240" r="4.5" fill="#1f2328"/>
  <text x="530" y="478" font-size="11" font-weight="700" fill="#1f2328">−</text>
  <text x="488" y="440" font-size="11" font-weight="700" fill="#1f2328">+</text>

  <!-- legenda -->
  <g font-size="11.5" fill="#1f2328">
    <line x1="40" y1="440" x2="66" y2="440" stroke="#d62828" stroke-width="4"/><text x="72" y="444">BAT+</text>
    <line x1="120" y1="440" x2="146" y2="440" stroke="#f77f00" stroke-width="4"/><text x="152" y="444">3V3</text>
    <line x1="196" y1="440" x2="222" y2="440" stroke="#24292f" stroke-width="4"/><text x="228" y="444">GND</text>
    <line x1="40" y1="466" x2="66" y2="466" stroke="#1d6fd8" stroke-width="4"/><text x="72" y="470">SDA</text>
    <line x1="120" y1="466" x2="146" y2="466" stroke="#e0b000" stroke-width="4"/><text x="152" y="470">SCL</text>
    <line x1="196" y1="466" x2="222" y2="466" stroke="#2a9d3f" stroke-width="4"/><text x="228" y="470">dati LED</text>
    <line x1="40" y1="492" x2="66" y2="492" stroke="#24292f" stroke-width="6"/><line x1="40" y1="492" x2="66" y2="492" stroke="#ffffff" stroke-width="3"/><text x="72" y="496">cicalino</text>
    <circle cx="200" cy="492" r="4.5" fill="#1f2328"/><text x="210" y="496">giunzione</text>
  </g>
</svg>
