<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Collegamento della LiPo ai pad BAT della XIAO tramite pigtail JST 1.25</title>
  <rect x="1" y="1" width="818" height="428" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Batteria: LiPo 1S → pad BAT+ / BAT−</text>
  <text x="410" y="56" text-anchor="middle" font-size="13" fill="#57606a">XIAO vista dal retro (schematico, non in scala)</text>

  <!-- XIAO retro -->
  <rect x="95" y="92" width="110" height="34" rx="8" fill="#a8b1bb" stroke="#6e7781"/>
  <text x="150" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">USB-C</text>
  <rect x="60" y="116" width="180" height="270" rx="14" fill="#1f2a37" stroke="#0d1117" stroke-width="2"/>
  <text x="150" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">XIAO (retro)</text>
  <!-- pad BAT -->
  <rect x="122" y="160" width="56" height="30" rx="4" fill="#d4a017" stroke="#8a6a0a" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">BAT−</text>
  <rect x="122" y="214" width="56" height="30" rx="4" fill="#d4a017" stroke="#8a6a0a" stroke-width="1.5"/>
  <text x="150" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">BAT+</text>
  <text x="150" y="275" text-anchor="middle" font-size="11.5" fill="#c9d1d9">BAT− = pad vicino</text>
  <text x="150" y="291" text-anchor="middle" font-size="11.5" fill="#c9d1d9">alla USB-C</text>

  <!-- fili pigtail 3-4 cm -->
  <path d="M178 175 C 260 175, 280 190, 360 190" fill="none" stroke="#24292f" stroke-width="5" stroke-linecap="round"/>
  <path d="M178 229 C 260 229, 280 214, 360 214" fill="none" stroke="#d62828" stroke-width="5" stroke-linecap="round"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#57606a">pigtail accorciato a 3–4 cm</text>

  <!-- connettore JST: lato scheda + lato cella -->
  <rect x="358" y="176" width="44" height="52" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <rect x="402" y="176" width="44" height="52" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <line x1="402" y1="176" x2="402" y2="228" stroke="#57606a" stroke-width="3"/>
  <text x="402" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">JST 1.25</text>
  <text x="402" y="268" text-anchor="middle" font-size="11.5" fill="#57606a">= interruttore</text>

  <path d="M446 190 L 520 190" stroke="#24292f" stroke-width="5" stroke-linecap="round"/>
  <path d="M446 214 L 520 214" stroke="#d62828" stroke-width="5" stroke-linecap="round"/>

  <!-- cella LiPo -->
  <rect x="520" y="150" width="250" height="104" rx="10" fill="#c0c8d0" stroke="#6e7781" stroke-width="2"/>
  <rect x="520" y="150" width="34" height="104" rx="8" fill="#9aa5b1" stroke="#6e7781" stroke-width="2"/>
  <text x="537" y="207" text-anchor="middle" font-size="10" font-weight="700" fill="#24292f" transform="rotate(-90 537 203)">PCM</text>
  <text x="662" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">LiPo 1S 400 mAh</text>
  <text x="662" y="210" text-anchor="middle" font-size="12" fill="#24292f">602040 · 3,7 V nominali</text>
  <text x="662" y="228" text-anchor="middle" font-size="12" fill="#24292f">carica 4,2 V · scarica &lt; 3,0 V</text>

  <!-- legenda colori -->
  <line x1="300" y1="312" x2="340" y2="312" stroke="#d62828" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="317" font-size="13" fill="#1f2328">BAT+ (rosso)</text>
  <line x1="470" y1="312" x2="510" y2="312" stroke="#24292f" stroke-width="5" stroke-linecap="round"/>
  <text x="520" y="317" font-size="13" fill="#1f2328">BAT− / GND (nero)</text>

  <!-- avviso -->
  <rect x="290" y="340" width="480" height="62" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="306" y="363" font-size="13" font-weight="700" fill="#7d4e00">⚠ Polarità invertita = scheda distrutta</text>
  <text x="306" y="384" font-size="12.5" fill="#7d4e00">Misura col multimetro quale filo è il + prima di saldare e prima di</text>
  <text x="306" y="399" font-size="12.5" fill="#7d4e00">innestare ogni batteria nuova: il colore dei fili non è garantito.</text>
</svg>
