<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Cicalino attivo 12095 collegato a D1 e GND</title>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Cicalino attivo 12095 (3 V) → D1</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#57606a">collegamento diretto al GPIO, senza transistor</text>

  <!-- XIAO -->
  <rect x="40" y="90" width="130" height="180" rx="12" fill="#1f2a37" stroke="#0d1117" stroke-width="2"/>
  <text x="90" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">XIAO</text>
  <g fill="#d4a017" stroke="#8a6a0a" stroke-width="1.5"><circle cx="170" cy="130" r="7"/><circle cx="170" cy="230" r="7"/></g>
  <g font-size="12" fill="#ffffff" text-anchor="end" font-weight="600"><text x="158" y="134">D1</text><text x="158" y="234">GND</text></g>

  <!-- filo D1 (bianco con bordo) e GND -->
  <path d="M170 130 L 420 130 L 420 150" fill="none" stroke="#24292f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 130 L 420 130 L 420 150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 230 L 500 230 L 500 210" fill="none" stroke="#24292f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="260" y="120" font-size="12.5" fill="#57606a">D1 / GPIO2 (filo bianco)</text>
  <text x="260" y="252" font-size="12.5" fill="#57606a">GND (filo nero)</text>

  <!-- cicalino visto dall'alto -->
  <circle cx="460" cy="180" r="62" fill="#24292f" stroke="#0d1117" stroke-width="2"/>
  <circle cx="460" cy="180" r="12" fill="#57606a"/>
  <circle cx="420" cy="150" r="9" fill="#d4a017" stroke="#8a6a0a"/>
  <circle cx="500" cy="210" r="9" fill="#d4a017" stroke="#8a6a0a"/>
  <text x="420" y="155" text-anchor="middle" font-size="12" font-weight="800" fill="#24292f">+</text>
  <text x="500" y="215" text-anchor="middle" font-size="14" font-weight="800" fill="#24292f">−</text>
  <text x="460" y="268" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">12 × 9,5 mm · passo 7,5 mm</text>

  <!-- note -->
  <g font-size="12.5" fill="#1f2328">
    <text x="555" y="120" font-weight="700">Da ricordare</text>
    <text x="555" y="143">• + = piedino lungo</text>
    <text x="555" y="163">• 25–30 mA: ok sul GPIO</text>
    <text x="555" y="183">• mai da BAT+ (è da 3 V)</text>
    <text x="555" y="203">• togli l'adesivo dal foro</text>
    <text x="555" y="223">• &gt; 35 mA → NPN + diodo</text>
    <text x="555" y="243">• ricerca: 200 ms on / 800 off</text>
  </g>
</svg>
